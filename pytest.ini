[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --tb=short
    --strict-markers
    -v
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires running services)
    slow: Slow tests (>5 seconds)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
